# The same Samba with SMB signing mandatory: Nemla must report "signing: required" and raise no finding.
[global]
   workgroup = LAB
   server string = Nemla integration lab (signing required)
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody
   log level = 1
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   pid directory = /tmp/smb
   lock directory = /tmp/smb
   state directory = /tmp/smb
   cache directory = /tmp/smb
   private dir = /tmp/smb
   server min protocol = SMB2
   server signing = mandatory

[public]
   path = /srv/share
   guest ok = yes
   read only = yes
