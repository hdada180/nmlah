# Samba as it ships: SMB2/3, signing offered but not required. A read-only guest share and no user accounts.
[global]
   workgroup = LAB
   server string = Nemla integration lab
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody
   log level = 1
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   pid directory = /tmp/smb
   lock directory = /tmp/smb
   state directory = /tmp/smb
   cache directory = /tmp/smb
   private dir = /tmp/smb
   server min protocol = SMB2
   server signing = auto

[public]
   path = /srv/share
   guest ok = yes
   read only = yes
