# Samba with the obsolete SMBv1 switched back on, only so that Nemla can be shown to notice it.
# A guest-only, read-only share in a throw-away container; never do this on a real network.
[global]
   workgroup = LAB
   server string = Nemla integration lab (SMBv1 on)
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody
   log level = 1
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   pid directory = /tmp/smb
   lock directory = /tmp/smb
   state directory = /tmp/smb
   cache directory = /tmp/smb
   private dir = /tmp/smb
   server min protocol = NT1
   server max protocol = SMB3
   server signing = auto

[public]
   path = /srv/share
   guest ok = yes
   read only = yes
