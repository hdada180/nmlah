name: Feature request
description: Suggest something Nemla should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Nemla is scoped to **reconnaissance and defensive monitoring** - see
        [Responsible use](../../README.md#responsible-use) and [CONTRIBUTING.md](../../CONTRIBUTING.md#before-you-start).
        Requests for active exploitation, credential attacks, or anything else that turns it into an offensive
        tool will be closed, whatever the framing.

        For anything beyond a small addition, describe the idea here before sending a PR - it saves both of us
        the time of writing code that will not be merged.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Nemla does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A rough sketch is fine - a CLI flag, a new finding, a new detector, a report field...

  - type: textarea
    id: alternatives
    attributes:
      label: What you are doing instead today
      description: A workaround, another tool, nothing - whatever is true. Helps judge how much this is worth.
