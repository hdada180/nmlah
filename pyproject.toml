[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemla"
dynamic = ["version"]
description = "Lightweight network reconnaissance, service intelligence and defensive monitoring: IPv4/IPv6 discovery, TCP and UDP scanning, service and OS fingerprinting, TLS analysis, evidence-based findings, reports, history and a 3D web interface (English, Arabic, Hebrew)."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "hdada180" }]
keywords = ["network", "port-scanner", "reconnaissance", "fingerprinting", "security", "monitoring", "ipv6", "udp", "sarif", "arabic", "hebrew"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Security",
    "Environment :: Console",
    "Environment :: Web Environment",
]
dependencies = []

[project.optional-dependencies]
arp = ["scapy>=2.5"]
dev = ["pytest", "pyflakes", "ruff", "mypy", "coverage"]

[project.scripts]
nemla = "nemla.main:main"

[project.urls]
Homepage = "https://github.com/hdada180/nmlah"
Issues = "https://github.com/hdada180/nmlah/issues"
Changelog = "https://github.com/hdada180/nmlah/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
# the one place the version is written: nemla/config.py (read from the source text, without importing the package)
version = { attr = "nemla.config.__version__" }

[tool.setuptools.packages.find]
# every package (and sub-package) under these two names is included automatically; nothing else is
include = ["nemla", "nemla.*", "nemla_ui", "nemla_ui.*"]

[tool.setuptools.package-data]
nemla_ui = ["web/*.*", "web/brand/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# a background thread that dies with an exception must fail the test that started it, not just print a warning
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "integration: needs a real Samba/xrdp server (run by the `integration` CI job; skipped unless NEMLA_INTEGRATION=1)",
    "privileged: needs root and Scapy (run by the `privileged` CI job; skipped otherwise)",
    "browser: needs Chrome or Chromium (skipped when none is installed)",
]

[tool.ruff]
line-length = 130
target-version = "py38"
extend-exclude = ["docs", "benchmarks/results"]

[tool.ruff.lint]
# E/F/W pycodestyle+pyflakes, B bugbear, UP pyupgrade (py38 target), C4 comprehensions, PIE, S security,
# PLE/PLW pylint errors and warnings, RUF ruff-specific. SIM is style only and left out on purpose.
select = ["E", "F", "W", "B", "UP", "C4", "PIE", "S", "PLE", "PLW", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Translation tables: long human-readable lines, and Hebrew/Arabic letters that look like Latin ones.
"nemla/_strings_base.py" = ["E501", "RUF001"]
"nemla/strings_extra.py" = ["E501", "RUF001"]
# Tests: assert is the point, servers bind loopback on purpose, hostile strings are test data, and long lines
# mirror wire data and expected reports (E501 stays on for the package itself).
"tests/*" = ["E501", "S101", "S104", "S105", "S106", "S108", "S110", "S301", "S310", "S324", "S603", "S607", "PLW1510", "RUF001", "RUF002", "RUF003"]
"benchmarks/*" = ["S101", "S104", "S603", "S607", "PLW0603"]

[tool.mypy]
python_version = "3.10"
files = ["nemla", "nemla_ui"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
# Scapy is optional and ships no type information.
module = ["scapy", "scapy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["nemla", "nemla_ui"]
# thin entry-point shims: nothing to cover beyond "does `python -m nemla` import cleanly", already checked elsewhere
omit = ["nemla/__main__.py", "nemla/main.py"]

[tool.coverage.report]
# a line that cannot run in this environment (the opposite branch of `if sys.platform == "win32"`, an
# import that fails because an optional dependency is absent, a defensive case that never fires in practice)
# is not a real gap: mark it, and it stops counting toward the percentage.
exclude_also = [
    "if TYPE_CHECKING:",
    "except ImportError:",
    "^\\s*\\.\\.\\.$",
]
