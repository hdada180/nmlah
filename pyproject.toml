[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nemla"
version = "2.0.0"
description = "Lightweight network reconnaissance, service intelligence and defensive monitoring: IPv4/IPv6 discovery, TCP and UDP scanning, service and OS fingerprinting, TLS analysis, evidence-based findings, reports, history and a 3D web interface (English, Arabic, Hebrew)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "hdada180" }]
keywords = ["network", "port-scanner", "reconnaissance", "fingerprinting", "security", "monitoring", "ipv6", "udp", "sarif", "arabic", "hebrew"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Security",
    "Environment :: Console",
    "Environment :: Web Environment",
]
dependencies = []

[project.optional-dependencies]
arp = ["scapy>=2.5"]
dev = ["pytest", "pyflakes"]

[project.scripts]
nemla = "nemla.main:main"

[project.urls]
Homepage = "https://github.com/hdada180/nmlah"
Issues = "https://github.com/hdada180/nmlah/issues"

[tool.setuptools]
packages = ["nemla", "nemla.discovery", "nemla.scanning", "nemla.fingerprint", "nemla.reports", "nemla_ui"]

[tool.setuptools.package-data]
nemla_ui = ["web/*.*", "web/brand/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
